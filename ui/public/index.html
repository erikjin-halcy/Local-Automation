<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Automation</title>
<meta name="theme-color" content="#1d1d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Automation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>window.CLOUD_MODE = !['localhost', '127.0.0.1'].includes(location.hostname);</script>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #5f5f5a; --line: #e3e2dd; --line-soft: #efeeea; --field: #f6f5f1;
    --accent: #b4532f; --accent-text: #ffffff; --accent-soft: #f8eae3; --accent-soft-text: #7e3a23;
    --ok: #2f7a45; --ok-soft: #e7f2ea; --ok-soft-text: #245f37;
    --bad: #b83a26; --bad-soft: #fbece8; --bad-soft-text: #8c2a1a;
    --run: #2f6fc9; --run-soft: #eaf1fb; --run-soft-text: #1f4e8c; --off: #a5a49e;
    --code: #efeeea; --focus: rgba(180, 83, 47, .28);
    --side: #1d1d1b; --side-text: #e9e8e3; --side-muted: #b5b4ae; --side-active: #2e2e2b; --side-ok: #5cb87a; --side-line: #3a3a37;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    --serif: "Iowan Old Style", "Charter", "Source Serif 4", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b19; --panel: #242422; --text: #ecebe6; --muted: #a3a29c; --line: #363633; --line-soft: #2e2e2b; --field: #1e1e1c;
      --accent: #d97757; --accent-text: #1b1b19; --accent-soft: #3a2a22; --accent-soft-text: #f0b49c;
      --ok: #5cb87a; --ok-soft: #22352a; --ok-soft-text: #9ad6ae;
      --bad: #e46a55; --bad-soft: #3a2420; --bad-soft-text: #f2a99b;
      --run: #6a9ee8; --run-soft: #1f2b3d; --run-soft-text: #a9c7f2; --off: #6b6a65;
      --code: #1e1e1c; --focus: rgba(217, 119, 87, .3);
      --side: #141413; --side-active: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  a { color: var(--accent); }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); margin: 0; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  button, .btn { font: inherit; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  button:hover, .btn:hover { border-color: var(--muted); }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .primary:hover { border-color: var(--accent); filter: brightness(1.06); }
  .danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  input[type=text], input[type=number], input[type=time], select, textarea { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=text], textarea { width: 100%; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  textarea { min-height: 220px; font: 13px/1.6 var(--mono); resize: vertical; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.run { background: var(--run); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-text); white-space: nowrap; }
  .chip.plain { background: var(--line-soft); color: var(--muted); }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--line-soft); color: var(--muted); }
  .badge.ok { background: var(--ok-soft); color: var(--ok-soft-text); }
  .badge.run { background: var(--run-soft); color: var(--run-soft-text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .empty { color: var(--muted); padding: 24px 4px; }
  .card.empty { padding: 20px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint.bad { color: var(--bad); }

  /* ---------- ram ---------- */
  .app { display: flex; min-height: 100vh; }
  .side { width: 248px; flex: none; background: var(--side); color: var(--side-text); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .brand .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .brand .logo svg { stroke: var(--accent-text); }
  .brand .title { font-weight: 600; font-size: 15px; color: #fff; }
  .brand button { margin-left: auto; font-size: 12px; padding: 4px 10px; background: transparent; color: var(--side-text); border-color: var(--side-line); }
  .brand .top-status { display: none; }
  .side .label { font-size: 12px; color: var(--side-muted); padding: 16px 10px 6px; font-weight: 500; }
  .side a.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-text); text-decoration: none; min-width: 0; }
  .side a.nav .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side a.nav:hover { background: var(--side-active); }
  .side a.nav.active { background: var(--side-active); color: #fff; font-weight: 500; }
  .side a.nav.off { color: var(--side-muted); }
  .side .dot.ok { background: var(--side-ok); }
  .side .foot { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .status { border-top: 1px solid var(--side-active); margin-top: 6px; padding: 10px 10px 0; font-size: 13px; }
  .status summary { cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; border-radius: 6px; }
  .status summary::-webkit-details-marker { display: none; }
  .status ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; color: var(--side-muted); font-size: 12px; }
  .status li { display: flex; align-items: center; gap: 8px; }
  .bottomnav { display: none; }
  main { flex: 1; min-width: 0; }
  .page { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 22px; max-width: 1120px; }

  /* ---------- översikt ---------- */
  .pagehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pagehead .spacer { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stat .k { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .v { font-size: 26px; font-weight: 600; margin-top: 2px; line-height: 1.3; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .stat .s.ok { color: var(--ok); } .stat .s.bad { color: var(--bad); }
  .tl { margin-top: 14px; display: flex; flex-direction: column; }
  .tl-row { display: grid; grid-template-columns: 160px 1fr; align-items: center; min-height: 30px; }
  .tl-row .who { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; color: inherit; text-decoration: none; }
  .tl-row .who:hover { text-decoration: underline; }
  .tl-track { position: relative; height: 30px; background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 25%); border-right: 1px solid var(--line); }
  .tl-track .mark { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 2px solid var(--accent); }
  .tl-track .mark.ok { background: var(--ok); border-color: var(--ok); }
  .tl-track .mark.bad { background: var(--bad); border-color: var(--bad); }
  .tl-track .mark.run { background: var(--run); border-color: var(--run); }
  .tl-track .band { position: absolute; top: 50%; left: 0; right: 0; height: 6px; transform: translateY(-50%); border-radius: 3px; background: repeating-linear-gradient(90deg, var(--accent) 0 3px, transparent 3px 9px); opacity: .7; }
  .tl-track .now { position: absolute; top: -2px; bottom: -2px; border-left: 2px solid var(--accent); }
  .tl-axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
  .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .job { display: flex; flex-direction: column; gap: 10px; }
  .job.off { background: transparent; border-style: dashed; }
  .job .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .job h3 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job h3 a { color: inherit; text-decoration: none; }
  .job h3 a:hover { text-decoration: underline; }
  .job .sub { font-size: 13px; color: var(--muted); }
  .job .sub.bad { color: var(--bad); }
  .job .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .job .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .job .acts .btn, .job .acts button { font-size: 13px; padding: 6px 12px; }
  .plan { display: flex; flex-direction: column; gap: 14px; }
  .planhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .planhead .spacer { flex: 1; }
  .planhead .more { font-size: 13px; }
  .plan .summary { margin: 0; font: 16px/1.55 var(--serif); }
  .plan .stale { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--line-soft); font-size: 13px; }
  .plangrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; }
  .plangrid h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .plan .todocount { margin-bottom: 8px; }
  .plan .md { font-size: 15px; }
  .sched { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .sched li { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; border-left: 3px solid transparent; }
  .sched .time { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .sched .what { overflow-wrap: anywhere; }
  .sched li.focus { background: var(--accent-soft); }
  .sched li.focus .what { color: var(--accent-soft-text); }
  .sched li.lunch .what { color: var(--muted); }
  .sched li.past { opacity: .55; }
  .sched li.now { border-left-color: var(--run); background: var(--run-soft); }
  .sched li.next { border-left-color: var(--accent); }
  .table { padding: 0; overflow: hidden; }
  .table h2 { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .table .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 10px 12px; }
  td { padding: 10px 12px; border-top: 1px solid var(--line-soft); }
  th:first-child, td:first-child { padding-left: 20px; }
  th:last-child, td:last-child { padding-right: 20px; text-align: right; }
  td.mono { font-family: var(--mono); white-space: nowrap; }
  td.ok { color: var(--ok); } td.bad { color: var(--bad); } td.run { color: var(--run); }

  /* ---------- jobbsida ---------- */
  .taskhead { background: var(--panel); border-bottom: 1px solid var(--line); padding: 20px 28px 0; display: flex; flex-direction: column; gap: 14px; }
  .crumbs { font-size: 13px; display: flex; gap: 8px; color: var(--muted); }
  .crumbs a { text-decoration: none; }
  .titlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .control { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .control label { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; min-height: 36px; }
  .control .sched { color: var(--muted); }
  .control .spacer { flex: 1; }
  .control .err { flex-basis: 100%; color: var(--bad); font-size: 13px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tabs a { padding: 10px 12px; border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .tabs a.active { color: var(--text); font-weight: 500; border-bottom-color: var(--accent); }
  .banner { margin: 16px 28px 0; padding: 12px 14px; border-radius: 10px; background: var(--run-soft); color: var(--run-soft-text); display: flex; align-items: center; gap: 10px; }
  .split { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .split .list { flex: 1 1 240px; max-width: 290px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; align-self: stretch; border-right: 1px solid var(--line); }
  .split .list .lbl { font-size: 12px; color: var(--muted); padding: 4px 8px; font-weight: 500; }
  .split .list button { display: block; width: 100%; text-align: left; padding: 10px; border: 1px solid transparent; background: none; }
  .split .list button:hover, .split .list button.active { background: var(--panel); border-color: var(--line); }
  .split .list .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .split .list .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .split .list .s.bad { color: var(--bad); }
  .split .view { flex: 999 1 420px; min-width: 0; padding: 24px 36px 48px; }
  .split .view .meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .split .view .meta .f { font-family: var(--mono); }
  .failbox { padding: 14px 16px; border-radius: 10px; background: var(--bad-soft); color: var(--bad-soft-text); margin-bottom: 14px; }
  .failbox a { color: inherit; }
  .md { font-family: var(--serif); font-size: 16px; line-height: 1.6; max-width: 720px; overflow-wrap: anywhere; }
  .md h1 { font-size: 26px; margin: 0 0 12px; }
  .md h2 { font-size: 20px; margin: 22px 0 6px; }
  .md h3, .md h4 { font-size: 17px; margin: 18px 0 4px; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote { margin: 0 0 10px; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
  .md pre { margin: 0 0 10px; }
  .md code { font-size: 13px; }
  .md li.todo { list-style: none; margin-left: -22px; }
  .md li.todo label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 2px 0; }
  .md li.todo input { margin-top: 5px; flex: none; }
  .md li.todo input:checked + span { text-decoration: line-through; color: var(--muted); }
  .md li.sub1 { margin-left: 22px; list-style-type: circle; } .md li.sub2 { margin-left: 44px; list-style-type: square; } .md li.sub3 { margin-left: 66px; list-style-type: square; }
  .md li.todo.sub1 { margin-left: 0; } .md li.todo.sub2 { margin-left: 22px; } .md li.todo.sub3 { margin-left: 44px; }
  .md h2 { padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .md h1 + h2, .md > h2:first-child { margin-top: 0; }
  .md :not(pre) > code { background: var(--line); padding: 1px 5px; border-radius: 4px; }
  .md del { color: var(--muted); }
  .md .table { overflow-x: auto; margin: 0 0 14px; }
  .md table { border-collapse: collapse; font-size: 14px; line-height: 1.45; min-width: 60%; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
  .md th { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .runhead { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .runhead button { font: 500 12px/1 var(--sans); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .runhead button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-soft-text); border-color: transparent; }
  .todocount { display: inline-block; font: 500 13px/1.5 var(--sans); padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-text); margin-bottom: 14px; }

  /* ---------- formulär ---------- */
  .form { padding: 22px 28px 40px; max-width: 840px; display: flex; flex-direction: column; gap: 16px; }
  .form .card { display: flex; flex-direction: column; gap: 10px; }
  .form .card > h2 { font-size: 13px; color: var(--muted); }
  .form .sentence { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
  .days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .days label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .mcp { display: grid; grid-template-columns: minmax(0, max-content) max-content 1fr; gap: 8px 14px; align-items: center; }
  .mcp .warn { font-size: 12px; color: var(--bad); }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .row > label { flex: 1; min-width: 160px; }
  label.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .dangerzone { border: 1px solid var(--bad-soft); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dangerzone > div { flex: 1; min-width: 220px; }
  .dangerzone h2 { font-size: 14px; }
  .savebar { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--text); color: var(--bg); border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
  .savebar .spacer { flex: 1; }
  .savebar .ghost { background: transparent; color: var(--bg); border-color: var(--muted); }
  .formactions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .login .card { max-width: 360px; width: 100%; text-align: center; }
  .login .card button { width: 100%; margin-top: 12px; justify-content: center; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); white-space: pre-wrap; z-index: 20; }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--bad); color: #fff; }

  /* ---------- mobil ---------- */
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .side { z-index: 5; width: auto; height: auto; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; overflow: visible; }
    .side > :not(.brand) { display: none !important; }
    .brand { padding: 0; }
    .brand .top-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin-left: auto; color: var(--side-text); }
    .brand .top-status + button { margin-left: 8px; }
    .bottomnav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
    .bottomnav a { min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; }
    .bottomnav a.active { color: var(--accent); font-weight: 600; }
    main { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    #toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
    .page { padding: 16px; gap: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat { padding: 12px 14px; }
    .stat .v { font-size: 18px; }
    .stats .stat:nth-child(3) { grid-column: 1 / -1; }
    .tl-row { grid-template-columns: 96px 1fr; }

<script>
const API = '/api';
const DAYS = [['mon', 'mån'], ['tue', 'tis'], ['wed', 'ons'], ['thu', 'tor'], ['fri', 'fre'], ['sat', 'lör'], ['sun', 'sön']];
const MCP_LABELS = { github: 'GitHub', slack: 'Slack', linear: 'Linear', posthog: 'PostHog', google: 'Gmail + Kalender (privat)', 'google-work': 'Gmail + Kalender (jobb)', notes: 'Apple Notes', obsidian: 'Obsidian' };
const TABS = [['results', 'Resultat'], ['runs', 'Körningar och loggar'], ['settings', 'Inställningar']];
const PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>';

let tasks = [];
let mcpServers = [];
let lastStatus = null;
let firstName = '';
let route = { view: 'overview' };
let currentHash = location.hash;
let dirty = false;
let openRun = null;
let openFile = null;
let viewSig = '';

// ---------- hjälpfunktioner ----------

async function call(method, url, body) {
  if (window.cloudCall) return window.cloudCall(method, url, body);
  const res = await fetch(API + url, {
    method,
    headers: { 'x-local-ui': '1', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    signal: AbortSignal.timeout(method === 'GET' ? 15000 : 60000),
  });
  const type = res.headers.get('Content-Type') || '';
  const data = type.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// html: används bara med text som redan escapats (md()) eller fasta strängar
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k.startsWith('aria-') || k.startsWith('data-')) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const c of children.flat()) if (c != null && c !== false) e.append(c);
  return e;
}

let toastTimer;
function toast(msg, bad = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', bad ? 6000 : 2500);
}

const enc = encodeURIComponent;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const taskHref = (name, tab = 'results') => `#/task/${enc(name)}/${tab}`;
// "sammanfatta-slack" -> "Sammanfatta slack"
const pretty = name => cap(name.replace(/[-_]+/g, ' ').trim());

function fmtTime(iso) {
  return new Date(iso).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
}
const clock = d => d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });

function dayDiff(d) {
  const a = new Date(d); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}

// "idag", "imorgon", "igår" eller "tors 29 okt"
function fmtDay(date) {
  const n = dayDiff(date);
  if (n === 0) return 'idag';
  if (n === 1) return 'imorgon';
  if (n === -1) return 'igår';
  return new Date(date).toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
}
const fmtRel = date => `${fmtDay(date)} ${clock(new Date(date))}`;

function runState(r) {
  if (!r) return { cls: '', text: 'aldrig körd' };
  if (r.running) return { cls: 'run', text: 'körs nu' };
  if (r.exit === 0) return { cls: 'ok', text: 'lyckades' };
  if (r.exit == null) return { cls: '', text: 'okänt resultat' };
  return { cls: 'bad', text: `misslyckades (${r.exit})` };
}
const taskState = t => t.running ? { cls: 'run', text: 'körs nu' } : runState(t.lastRun);

// "Sammanfatta Slack" -> "sammanfatta-slack"
function slugify(s) {
  return s.trim().toLowerCase()
    .replace(/[åä]/g, 'a').replace(/ö/g, 'o')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').replace(/-{2,}/g, '-');
}

// ---------- schema ----------

function parseSchedule(s) {
  const p = (s || '').trim().split(/\s+/);
  if (p[0] === 'every') {
    const m = (p[1] || '').match(/^(\d+)([smh]?)$/i);
    if (m) {
      let n = Number(m[1]), u = (m[2] || 's').toLowerCase();
      if (u === 's') { if (n % 3600 === 0) { n /= 3600; u = 'h'; } else { n = Math.max(1, Math.round(n / 60)); u = 'm'; } }
      return { type: 'every', n, unit: u };
    }
  }
  if (p[0] === 'daily' || p[0] === 'weekdays') return { type: p[0], time: pad(p[1]) };
  if (p[0] === 'weekly') return { type: 'weekly', days: (p[1] || '').split(','), time: pad(p[2]) };
  return { type: 'daily', time: '08:00' };
}

function pad(t) {
  const m = (t || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? `${m[1].padStart(2, '0')}:${m[2]}` : '08:00';
}

function buildSchedule(st) {
  if (st.type === 'every') return `every ${st.n}${st.unit}`;
  if (st.type === 'weekly') return `weekly ${st.days.join(',')} ${st.time}`;
  return `${st.type} ${st.time}`;
}

function describe(s) {
  const st = parseSchedule(s);
  if (st.type === 'every') {
    const unit = st.unit === 'h' ? 'timme' : 'minut';
    if (st.n === 1) return `Varje ${unit}`;
    if (st.n === 2) return `Varannan ${unit}`;
    const suffix = [1, 2].includes(st.n % 10) && ![11, 12].includes(st.n % 100) ? 'a' : 'e';
    return `Var ${st.n}:${suffix} ${unit}`;
  }
  if (st.type === 'daily') return `Varje dag ${st.time}`;
  if (st.type === 'weekdays') return `Vardagar ${st.time}`;
  const names = st.days.map(d => (DAYS.find(x => x[0] === d) || [d, d])[1]);
  return `${names.join(', ')} ${st.time}`;
}

// Veckodagar (0 = mån) då schemat körs på en fast tid, eller null för intervall
function scheduleDays(st) {
  if (st.type === 'daily') return [0, 1, 2, 3, 4, 5, 6];
  if (st.type === 'weekdays') return [0, 1, 2, 3, 4];
  if (st.type === 'weekly') return st.days.map(d => DAYS.findIndex(x => x[0] === d)).filter(i => i >= 0);
  return null;
}
const weekday = d => (d.getDay() + 6) % 7;

// Nästa körning enligt schemat, eller null för intervallscheman
function nextRun(s, now = new Date()) {
  const st = parseSchedule(s);
  const days = scheduleDays(st);
  if (!days) return null;
  const [h, m] = st.time.split(':').map(Number);
  for (let i = 0; i < 8; i++) {
    const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(h, m, 0, 0);
    if (d > now && days.includes(weekday(d))) return d;
  }
  return null;
}

function schedText(t) {
  if (!t.enabled) return 'Körs bara när du trycker på Kör nu';
  const next = nextRun(t.schedule);
  return describe(t.schedule) + (next ? ` · nästa: ${fmtRel(next)}` : '');
}

// ---------- markdown ----------

// Enkel markdown för rapporterna. All text escapas innan formatering läggs på,
// så innehållet i filerna kan aldrig bli HTML. Länkar måste vara http(s).
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/~~([^~]+)~~/g, '<del>$1</del>')
  .replace(/(^|[\s(])[*_]([^*_\s][^*_]*)[*_](?=[\s).,:;!?]|$)/g, '$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

function md(text) {
  // Punkter i en checklista får sitt radnummer så att bocken kan skrivas tillbaka till filen
  // Indragna punkter (2 mellanslag per nivå) blir underpunkter med klassen sub1–sub3
  const item = i => {
    const cls = [i.todo ? 'todo' : '', i.level ? `sub${i.level}` : ''].filter(Boolean).join(' ');
    const attr = cls ? ` class="${cls}"` : '';
    return i.todo
      ? `<li${attr}><label><input type="checkbox" data-line="${i.todo.line}" data-text="${esc(i.todo.text)}"${i.todo.done ? ' checked' : ''}><span>${inline(i.text)}</span></label></li>`
      : `<li${attr}>${inline(i.text)}</li>`;
  };
  // Tabeller: | a | b | följt av |---|---|
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const isSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const out = [];
  let para = [], list = null, fence = null;
  const flush = () => {
    if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
    if (list) { out.push(`<${list.tag}${list.items.some(i => i.todo) ? ' class="todos"' : ''}>${list.items.map(item).join('')}</${list.tag}>`); list = null; }
  };
  const lines = text.split('\n');
  for (let n = 0; n < lines.length; n++) {
    const line = lines[n];
    if (fence) {
      if (/^\s*```/.test(line)) { out.push(`<pre>${esc(fence.join('\n'))}</pre>`); fence = null; }
      else fence.push(line);
      continue;
    }
    let m;
    if (/^\s*```/.test(line)) { flush(); fence = []; }
    else if (!line.trim()) flush();
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = Math.min(m[1].length, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); }
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); }
    else if ((m = line.match(/^>\s?(.*)$/))) { flush(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if (line.includes('|') && isSep(lines[n + 1] || '') && !isSep(line)) {
      flush();
      const head = cells(line), rows = [];
      for (n += 2; n < lines.length && lines[n].includes('|') && lines[n].trim(); n++) rows.push(cells(lines[n]));
      n--;
      out.push(`<div class="table"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${head.map((_, i) => `<td>${inline(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    }
    else if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      const tag = /\d/.test(m[2]) ? 'ol' : 'ul';
      const indent = m[1].replace(/\t/g, '  ').length;
      if (para.length || (list && list.tag !== tag && indent <= list.indent)) flush();
      if (!list) list = { tag, items: [], indent };
      const level = Math.min(3, Math.max(0, Math.floor((indent - list.indent) / 2)));
      const todo = m[3].match(/^\[([ xX])\]\s+(.*)$/);
      list.items.push(todo ? { level, text: todo[2], todo: { line: n, text: todo[2], done: todo[1] !== ' ' } } : { level, text: m[3] });
    }
    else if (list && /^\s{2,}\S/.test(line)) list.items[list.items.length - 1].text += ' ' + line.trim();
    else { if (list) flush(); para.push(line.trim()); }
  }
  if (fence) out.push(`<pre>${esc(fence.join('\n'))}</pre>`);
  flush();
  return out.join('\n');
}

// ---------- ram: status och meny ----------

async function loadStatus() {
  try { lastStatus = await call('GET', '/status'); } catch { lastStatus = null; }
  renderStatus();
}

function renderStatus() {
  const s = lastStatus;
  const items = [];   // [ok, text, neutral]
  let ok = true, text;
  if (!s) { ok = false; text = 'Servern svarar inte'; }
  else if (s.mode === 'cloud') { text = 'Körs i molnet'; items.push([true, text]); }
  else {
    if ('agentOnline' in s) items.push([s.agentOnline, s.agentOnline ? 'Macen online' : `Macen offline${s.lastSeen ? ' sedan ' + fmtTime(s.lastSeen) : ''}`]);
    items.push([s.docker, s.docker ? 'Docker igång' : 'Docker av (startas vid körning)', true]);
    items.push([s.image, s.image ? 'Image byggd' : 'Image byggs vid första körning', true]);
    items.push([s.token, s.token ? 'Token finns' : 'Token saknas i .env']);
    const problem = items.find(([good, , neutral]) => !good && !neutral);
    ok = !problem;
    text = problem ? problem[1].replace(/ sedan .*/, '') : 'agentOnline' in s ? 'Macen online' : 'Allt fungerar';
  }
  const dot = () => el('span', { class: 'dot ' + (ok ? 'ok' : 'bad') });
  const box = document.getElementById('status');
  box.querySelector('summary').replaceChildren(dot(), text);
  box.querySelector('ul').replaceChildren(...items.map(([good, t, neutral]) =>
    el('li', {}, el('span', { class: 'dot ' + (good ? 'ok' : neutral ? '' : 'bad') }), t)));
  document.getElementById('top-status').replaceChildren(dot(), text);
}

async function loadTasks() {
  try { tasks = await call('GET', '/tasks'); } catch (e) { toast(e.message, true); }
  renderNav();
}

function renderNav() {
  const active = route.view === 'task' ? route.name : null;
  document.getElementById('nav-jobs').replaceChildren(...tasks.map(t =>
    el('a', {
      class: 'nav' + (t.name === active ? ' active' : '') + (t.enabled ? '' : ' off'),
      href: taskHref(t.name), 'aria-current': t.name === active ? 'page' : null,
    }, el('span', { class: 'dot ' + taskState(t).cls }), el('span', { class: 'txt' }, pretty(t.name)))));
  document.querySelectorAll('[data-nav]').forEach(a => {
    const on = a.dataset.nav === route.view;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

// ---------- routing ----------
// #/  ·  #/new  ·  #/profile  ·  #/task/<namn>/<results|runs|settings>

function parseRoute() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (p[0] === 'new') return { view: 'new' };
  if (p[0] === 'profile') return { view: 'profile' };
  if (p[0] === 'task' && p[1]) return { view: 'task', name: p[1], tab: TABS.some(x => x[0] === p[2]) ? p[2] : 'results' };
  return { view: 'overview' };
}

function onHashChange() {
  if (location.hash === currentHash) return;
  if (dirty && !confirm('Du har osparade ändringar. Vill du lämna dem?')) { location.hash = currentHash; return; }
  const prev = route;
  currentHash = location.hash;
  route = parseRoute();
  dirty = false;
  if (!(prev.view === 'task' && route.view === 'task' && prev.name === route.name)) { openRun = null; openFile = null; }
  render();
}

function render() {
  viewSig = '';
  renderNav();
  window.scrollTo(0, 0);
  if (route.view === 'profile') return renderProfile();
  if (route.view === 'new') return renderSettings(document.getElementById('main'), null);
  if (route.view === 'task') return renderTask();
  renderOverview();
  loadPlan().then(() => { if (route.view === 'overview') renderOverview(true); });
}

function greeting() {
  const h = new Date().getHours();
  const g = h < 5 ? 'God natt' : h < 10 ? 'God morgon' : h < 18 ? 'Hej' : 'God kväll';
  return firstName ? `${g}, ${firstName}` : g;
}

function renderOverview(auto = false) {
  const now = new Date();
  const sig = JSON.stringify([tasks, firstName, now.getMinutes(), plan?.file]);
  if (auto && sig === viewSig) return;
  viewSig = sig;
  const active = tasks.filter(t => t.enabled);
  const upcoming = active.map(t => ({ t, at: nextRun(t.schedule, now) })).filter(x => x.at).sort((a, b) => a.at - b.at);
  const next = upcoming[0];
  const nextNames = next ? upcoming.filter(x => +x.at === +next.at).map(x => pretty(x.t.name)) : [];
  const recent = tasks.filter(t => t.lastRun && now - new Date(t.lastRun.start) < 86400000);
  const failed = recent.filter(t => taskState(t).cls === 'bad');
  const running = tasks.filter(t => t.running);
  const off = tasks.length - active.length;

  const head = el('div', { class: 'pagehead' },
    el('div', {},
      el('h1', {}, greeting()),
      el('p', { class: 'muted', style: 'margin:2px 0 0' },
        cap(now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' })) +
        ` · ${active.length} ${active.length === 1 ? 'aktivt jobb' : 'aktiva jobb'}`)),
    el('span', { class: 'spacer' }),
    el('a', { class: 'btn primary', href: '#/new' }, '+ Nytt jobb'));

    el('div', { class: 'card stat' },

      el('div', { class: 'v' }, `${recent.length} jobb kördes`),
      running.length ? el('div', { class: 's' }, `${running.length} körs just nu`)
        : !recent.length ? el('div', { class: 's' }, 'Inga körningar')
        : failed.length ? el('div', { class: 's bad' }, `${failed.length} misslyckades`)
        : el('div', { class: 's ok' }, 'Alla lyckades')),
    el('div', { class: 'card stat' },
      el('div', { class: 'k' }, 'Nästa körning'),
      el('div', { class: 'v' }, next ? clock(next.at) : '–'),
      el('div', { class: 's' }, next ? `${cap(fmtDay(next.at))} · ${nextNames.join(', ')}` : active.length ? 'Bara intervalljobb' : 'Inga aktiva jobb')),
    el('div', { class: 'card stat' },
      el('div', { class: 'k' }, 'Jobb'),
      el('div', { class: 'v' }, `${active.length} av ${tasks.length} aktiva`),
      el('div', { class: 's' }, off ? `${off} ${off === 1 ? 'avstängt' : 'avstängda'}, körs bara för hand` : 'Alla körs enligt schema')));

  document.getElementById('main').replaceChildren(el('div', { class: 'page' },

    recentTable()));
}

function timeline(now) {
  const rows = tasks.filter(t => t.enabled);
  if (!rows.length) return null;
  const today = weekday(now);
  const pct = d => ((d.getHours() * 60 + d.getMinutes()) / 1440 * 100).toFixed(2) + '%';
  return el('section', { class: 'card', 'aria-labelledby': 'tl-h' },
    el('h2', { id: 'tl-h' }, 'Jobbens körningar idag'),
    el('div', { class: 'tl' },
      ...rows.map(t => {
        const st = parseSchedule(t.schedule);
        const days = scheduleDays(st);
        const track = el('div', { class: 'tl-track' });
        if (!days) track.append(el('span', { class: 'band', title: describe(t.schedule) }));
        else if (days.includes(today)) {
          const [h, m] = st.time.split(':').map(Number);
          const at = new Date(now); at.setHours(h, m, 0, 0);
          const ranToday = t.lastRun && dayDiff(t.lastRun.start) === 0 && new Date(t.lastRun.start) >= at - 60000;
          const state = at > now ? 'kommer' : ranToday ? taskState(t).text : 'kördes inte';
          const mark = el('span', { class: 'mark ' + (at <= now && ranToday ? taskState(t).cls : ''), title: `${st.time} · ${state}` });
          mark.style.left = pct(at);
          track.append(mark);
        }
        const nowLine = el('span', { class: 'now', 'aria-hidden': 'true' });
        nowLine.style.left = pct(now);
        track.append(nowLine);
        return el('div', { class: 'tl-row' }, el('a', { class: 'who', href: taskHref(t.name) }, pretty(t.name)), track);
      }),
      el('div', { class: 'tl-row' }, el('span'),
        el('div', { class: 'tl-axis', 'aria-hidden': 'true' }, ...['00', '06', '12', '18', '24'].map(x => el('span', {}, x))))));
}

function mcpChips(t) {

  return t.mcp.map(m => el('span', { class: 'chip' }, `${MCP_LABELS[m.name] || m.name} · ${m.level === 'write' ? 'läsa + skriva' : 'läsa'}`));

function jobCard(t) {

function recentTable() {

// ---------- dagsplan på översikten ----------
// Hämtas från jobbet "dagsplan", som skriver dagsplan-ÅÅÅÅ-MM-DD.md med
// rubrikerna "## Att göra" och "## Schema".

const PLAN_TASK_RE = /^dagsplan/i;
const PLAN_FILE_RE = /^dagsplan-(\d{4}-\d{2}-\d{2})\.md$/;
let plan = null;   // { task, file, content }, { task } om ingen fil finns, annars null

async function loadPlan() {
  const t = tasks.find(x => PLAN_TASK_RE.test(x.name));
  if (!t) { plan = null; return; }
  try {
    const files = (await call('GET', `/tasks/${enc(t.name)}/files`))
      .filter(f => PLAN_FILE_RE.test(f.path)).sort((a, b) => b.path.localeCompare(a.path));
    const f = files[0];
    if (!f) { plan = { task: t.name }; return; }
    if (plan?.task === t.name && plan.file?.path === f.path && plan.file.modified === f.modified) return;
    plan = { task: t.name, file: f, content: await call('GET', `/tasks/${enc(t.name)}/files/${enc(f.path)}`) };
  } catch { /* behåll den plan vi redan har */ }
}

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hhmm = min => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

// Raderna under "## <rubrik>" fram till nästa rubrik på nivå 1–2.
// offset = radnumret i filen där texten börjar.
function mdSection(content, title) {
  const lines = content.split('\n');
  const start = lines.findIndex(l => l.trim().toLowerCase().startsWith('## ' + title.toLowerCase()));
  if (start < 0) return null;
  let end = lines.findIndex((l, i) => i > start && /^#{1,2}\s/.test(l));
  if (end < 0) end = lines.length;
  return { offset: start + 1, text: lines.slice(start + 1, end).join('\n') };
}

// "- 09:00–09:30 Möte: X" -> { from: 540, to: 570, text: 'Möte: X' }
function parseBlocks(text) {
  const out = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*[-*+]\s+(?:\*\*)?(\d{1,2})[:.](\d{2})\s*[–—-]\s*(\d{1,2})[:.](\d{2})(?:\*\*)?\s*:?\s*(.*)$/);
    if (m) out.push({ from: +m[1] * 60 + +m[2], to: +m[3] * 60 + +m[4], text: m[5].trim() });
  }
  return out;
}

function planSection(now) {
  if (!plan) return null;
  const t = tasks.find(x => x.name === plan.task);
  const runBtn = t && el('button', { type: 'button', disabled: t.running, onclick: e => runNow(t, e.currentTarget) },
    t.running ? 'Gör dagsplanen…' : 'Gör dagens plan nu');
  const head = sub => el('div', { class: 'planhead' },
    el('h2', { id: 'plan-h' }, 'Din dag'), sub ? el('span', { class: 'muted' }, sub) : null,
    el('span', { class: 'spacer' }), el('a', { href: taskHref(plan.task), class: 'more' }, 'Hela dagsplanen'));
  if (!plan.file) {
    return el('section', { class: 'card plan', 'aria-labelledby': 'plan-h' },
      head(), el('div', { class: 'stale' }, el('span', {}, 'Ingen dagsplan än.'), runBtn));
  }

  const day = plan.file.path.match(PLAN_FILE_RE)[1];
  const today = day === isoDay(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const lines = plan.content.split('\n');
  const h1 = lines.findIndex(l => /^#\s/.test(l));
  const h2 = lines.findIndex(l => /^##\s/.test(l));
  const summary = h2 > h1 ? lines.slice(h1 + 1, h2).join(' ').trim() : '';

  const sched = mdSection(plan.content, 'Schema');
  const blocks = sched ? parseBlocks(sched.text) : [];
  const current = today ? blocks.find(b => nowMin >= b.from && nowMin < b.to) : null;
  const next = today && !current ? blocks.find(b => b.from > nowMin) : null;
  const schedEl = blocks.length
    ? el('ol', { class: 'sched' }, ...blocks.map(b => {
      const cls = [
        b === current ? 'now' : b === next ? 'next' : today && nowMin >= b.to ? 'past' : '',
        /^fokus/i.test(b.text) ? 'focus' : /^lunch/i.test(b.text) ? 'lunch' : '',
      ].filter(Boolean).join(' ');
      return el('li', { class: cls, 'aria-current': b === current ? 'time' : null },
        el('span', { class: 'time' }, `${hhmm(b.from)}–${hhmm(b.to)}`),
        el('span', { class: 'what', html: inline(b.text) }),
        b === current ? el('span', { class: 'badge run' }, 'Pågår') : b === next ? el('span', { class: 'badge' }, 'Nästa') : null);
    }))
    : sched ? el('div', { class: 'md', html: md(sched.text) })
    : el('p', { class: 'muted' }, 'Rapporten har inget schema.');

  const todo = mdSection(plan.content, 'Att göra');
  let todoEl = el('p', { class: 'muted' }, 'Inga punkter.');
  let count = null;
  if (todo) {
    todoEl = el('div', { class: 'md', html: md(todo.text) });
    count = wireTodos(todoEl, plan.task, plan.file, todo.offset);
  }

  return el('section', { class: 'card plan', 'aria-labelledby': 'plan-h' },
    head(today ? null : `från ${fmtDay(day + 'T12:00')}`),
    today ? null : el('div', { class: 'stale' }, el('span', {}, 'Dagens plan är inte gjord än.'), runBtn),
    summary ? el('p', { class: 'summary', html: inline(summary) }) : null,
    el('div', { class: 'plangrid' },
      el('div', {}, el('h3', {}, 'Schema'), schedEl),
      el('div', {}, el('h3', {}, 'Att göra'), count, todoEl)));
}

// ---------- åtgärder ----------

async function runNow(t, btn) {
  if (btn) btn.disabled = true;
  try { await call('POST', `/tasks/${enc(t.name)}/run`); toast('Körning startad'); openRun = null; }
  catch (err) { toast(err.message, true); if (btn) btn.disabled = false; }
  setTimeout(refresh, 800);
}

// Slår på eller av schemat utan att röra resten av jobbet
async function setEnabled(t, enabled, input) {
  if (input) input.disabled = true;
  try {
    await call('PUT', '/tasks/' + enc(t.name), { name: t.name, schedule: t.schedule, enabled, digest: !!t.digest, mcp: t.mcp || [], prompt: t.prompt });
    toast(enabled ? 'Jobbet körs nu enligt schemat' : 'Avstängt – körs bara för hand');
  } catch (err) {
    toast(err.message, true);
    if (input && 'checked' in input) input.checked = !enabled;
  }
  if (input) input.disabled = false;
  await loadTasks();
  refreshView();
}

// auto = anropad av den periodiska uppdateringen; ritar bara om när något ändrats
async function renderTab(auto = false) {
  const body = document.querySelector('[data-body]');
  if (!body || route.view !== 'task' || route.tab === 'settings') return;
  const { name: task, tab } = route;
  const name = enc(task);
  const stale = () => route.view !== 'task' || route.name !== task || route.tab !== tab;
  try {
    if (tab === 'runs') {
      const runs = await call('GET', `/tasks/${name}/runs`);
      if (stale()) return;
      const open = runs.find(r => r.id === openRun);
      if (auto && tab + task + JSON.stringify(runs) + openRun === viewSig && !(open && open.running)) return;
      if (!runs.length) {
        viewSig = tab + task + '[]' + openRun;
        return body.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'card empty' }, 'Inga körningar än. Tryck på "Kör nu" för att testa.')));
      }
      if (!open) openRun = runs[0].id;
      const { log } = await call('GET', `/tasks/${name}/runs/${openRun}`);
      if (stale()) return;
      viewSig = tab + task + JSON.stringify(runs) + openRun;
      const run = runs.find(r => r.id === openRun);
      body.replaceChildren(el('div', { class: 'split' },
        el('div', { class: 'list' }, el('div', { class: 'lbl' }, 'Körningar'),
          ...runs.map(r => {
            const s = runState(r);
            return el('button', { type: 'button', class: r.id === openRun ? 'active' : '', 'aria-pressed': String(r.id === openRun), onclick: () => { openRun = r.id; renderTab(); } },
              el('div', { class: 't' }, el('span', { class: 'dot ' + s.cls }), cap(fmtRel(r.start))),
              el('div', { class: 's' + (s.cls === 'bad' ? ' bad' : '') }, cap(s.text)));
          })),
        el('div', { class: 'view' },
          el('div', { class: 'meta' }, el('span', {}, `Körning ${fmtTime(run.start)}`), el('span', {}, cap(runState(run).text))),
          runLogView(run, log))));
      return;
    }

    const files = (await call('GET', `/tasks/${name}/files`)).slice().sort((a, b) => b.modified.localeCompare(a.modified));
    if (stale()) return;
    const t = tasks.find(x => x.name === task);
    const sig = tab + task + JSON.stringify(files) + openFile + JSON.stringify(t?.lastRun);
    if (auto && sig === viewSig) return;
    if (!files.length) {
      viewSig = sig;
      return body.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'card empty' },
        'Jobbet har inte skrivit några filer än. Det Claude sparar i /work visas här.',
        t && taskState(t).cls === 'bad' ? el('div', { style: 'margin-top:8px' }, 'Senaste körningen misslyckades – ', el('a', { href: taskHref(task, 'runs') }, 'se loggen'), '.') : null)));
    }
    if (!openFile || !files.some(f => f.path === openFile)) openFile = files[0].path;
    const file = files.find(f => f.path === openFile);
    const content = await call('GET', `/tasks/${name}/files/${file.path.split('/').map(enc).join('/')}`).catch(e => ({ error: e.message }));
    if (stale()) return;
    viewSig = tab + task + JSON.stringify(files) + openFile + JSON.stringify(t?.lastRun);
    // Senaste körningen misslyckades efter att den nyaste filen skrevs
    const failedSince = t?.lastRun && taskState(t).cls === 'bad' && new Date(t.lastRun.start) > new Date(files[0].modified);
    body.replaceChildren(el('div', { class: 'split' },
      el('div', { class: 'list' }, el('div', { class: 'lbl' }, 'Filer från det här jobbet'),
        ...files.map(f => el('button', { type: 'button', class: f.path === openFile ? 'active' : '', 'aria-pressed': String(f.path === openFile), onclick: () => { openFile = f.path; renderTab(); } },
          el('div', { class: 't' }, cap(fmtDay(f.modified))),
          el('div', { class: 's' }, f.path)))),
      el('article', { class: 'view' },
        failedSince ? el('div', { class: 'failbox' },
          el('strong', {}, 'Senaste körningen misslyckades'),
          el('div', { style: 'font-size:13px' }, `${cap(fmtRel(t.lastRun.start))} skrevs ingen ny fil. `, el('a', { href: taskHref(task, 'runs') }, 'Öppna loggen'), '.')) : null,
        el('div', { class: 'meta' }, el('span', { class: 'f' }, file.path), el('span', {}, `Sparad ${fmtRel(file.modified)}`), el('span', {}, `${(file.size / 1024).toFixed(1)} kB`)),
        typeof content !== 'string' ? el('div', { class: 'failbox' }, content.error)
          : /\.(md|markdown)$/i.test(file.path) ? reportView(task, file, content)
          : el('pre', {}, content))));
  } catch (e) { body.replaceChildren(el('div', { class: 'page' }, el('div', { class: 'empty' }, e.message))); }
}

// En körnings logg: "=== jobb datum ===", Claudes svar och "=== exit N ===". Svaret visas formaterat
// som standard när körningen lyckades; misslyckade och pågående körningar visas som rå logg.
const runRaw = {};
function runLogView(run, log) {
  const lines = (log || '').split('\n');
  const start = lines.findLastIndex(l => /^=== .+ ===$/.test(l) && !/^=== exit -?\d+ ===$/.test(l));
  const end = lines.findLastIndex(l => /^=== exit -?\d+ ===$/.test(l));
  // Claude CLI:ts egna varningar (t.ex. om stdin) hör inte till svaret
  const answer = lines.slice(start + 1, end > start ? end : undefined)
    .filter(l => !/^Warning: no stdin data received/.test(l)).join('\n').trim();
  const raw = runRaw[run.id] ?? (run.running || run.exit !== 0 || !answer);
  const toggle = (label, value) => el('button', { type: 'button', 'aria-pressed': String(raw === value),
    onclick: () => { runRaw[run.id] = value; renderTab(); } }, label);
  const head = answer ? el('div', { class: 'runhead' }, toggle('Svaret', false), toggle('Hela loggen', true)) : null;
  if (raw) return el('div', {}, head, el('pre', {}, log || '(tom logg)'));
  const view = el('div', { class: 'md', html: md(answer) });
  // Checkboxar i loggen hör inte till någon fil och kan inte bockas av här
  view.querySelectorAll('input[type=checkbox]').forEach(i => { i.disabled = true; });
  return el('div', {}, head, view);
}

// Rapporten som formaterad text. Punkter som "- [ ] ..." blir checkboxar och
// bocken skrivs tillbaka till filen (lokalt via server.mjs, i molnet via cloud.js).
function reportView(task, file, content) {
  const view = el('div', { class: 'md', html: md(content) });
  const count = wireTodos(view, task, file);
  return count ? el('div', {}, count, view) : view;
}

// Kopplar checkboxarna i en renderad rapport till filen. offset = radnumret
// där den renderade texten börjar i filen. Returnerar en räknare, eller null.
function wireTodos(view, task, file, offset = 0) {
  const boxes = [...view.querySelectorAll('input[data-line]')];
  if (!boxes.length) return null;
  const count = el('div', { class: 'todocount', role: 'status' });
  const update = () => {
    const left = boxes.filter(b => !b.checked).length;
    count.textContent = left ? `Att göra: ${left} kvar av ${boxes.length}` : `Allt avbockat (${boxes.length} av ${boxes.length})`;
  };
  update();
  const url = `/tasks/${enc(task)}/files/${file.path.split('/').map(enc).join('/')}`;
  for (const b of boxes) {
    b.addEventListener('change', async () => {
      const line = Number(b.dataset.line) + offset;
      b.disabled = true;
      update();
      try {
        await call('PATCH', url, { line, checked: b.checked, text: b.dataset.text });
        // I molnet ändras inte filens "modified", så dagsplanens kopia uppdateras här
        if (plan?.task === task && plan.file?.path === file.path) {
          const lines = plan.content.split('\n');
          lines[line] = lines[line].replace(/\[[ xX]\]/, b.checked ? '[x]' : '[ ]');
          plan.content = lines.join('\n');
        }
      } catch (err) { b.checked = !b.checked; update(); toast(err.message, true); }
      b.disabled = false;
    });
  }
  return count;
}

// ---------- inställningar och nytt jobb ----------

function renderSettings(container, t) {
  const isNew = !t;
  const task = t || { name: '', schedule: 'daily 08:00', enabled: true, digest: false, mcp: [], prompt: '' };
  const frag = document.getElementById('settings-tpl').content.cloneNode(true);
  const $ = s => frag.querySelector(s);
  $('[data-newhead]').hidden = !isNew;
  $('[data-enabled-row]').hidden = !isNew;
  $('[data-create]').hidden = !isNew;
  $('[data-danger]').hidden = isNew;
  $('[data-name]').value = task.name;
  $('[data-enabled]').checked = task.enabled;
  $('[data-digest]').checked = !!task.digest;
  $('[data-prompt]').value = task.prompt;
  if (!isNew) $('[data-danger-text]').textContent = `Loggar och filer i work/${task.name} sparas.`;

  const st = parseSchedule(task.schedule);
  $('[data-type]').value = st.type;
  $('[data-n]').value = st.n || 30;
  $('[data-unit]').value = st.unit || 'm';
  $('[data-time]').value = st.time || '08:00';
  $('[data-days]').append(...DAYS.map(([v, label]) =>
    el('label', {}, el('input', { type: 'checkbox', value: v, checked: (st.days || ['mon']).includes(v) }), label)));

  $('[data-mcp]').append(...mcpServers.flatMap(s => {
    const chosen = (task.mcp || []).find(m => m.name === s.name);
    const label = MCP_LABELS[s.name] || s.name;
    const sel = el('select', { 'aria-label': `Åtkomst till ${label}` },
      el('option', { value: '', textContent: 'Av' }),
      ...s.levels.map(l => el('option', { value: l, textContent: l === 'write' ? 'Läsa + skriva' : 'Läsa' })));
    sel.dataset.mcpName = s.name;
    sel.value = chosen ? chosen.level : '';
    const warn = [
      s.missing.length ? `Saknas i .env: ${s.missing.join(', ')}` : '',
      s.needsLogin ? 'Kräver engångsinloggning, se README' : '',
    ].filter(Boolean).join(' · ');
    return [el('span', {}, label), sel, el('span', { class: 'warn' }, warn)];
  }));
  if (!mcpServers.length) $('[data-mcp]').append(el('span', { class: 'hint' }, 'Inga MCP-servrar i mcp/.'));

  container.replaceChildren(frag);
  const root = container;
  const q = s => root.querySelector(s);
  const markDirty = () => { dirty = true; if (!isNew) q('[data-savebar]').hidden = false; };

  const current = () => buildSchedule({
    type: q('[data-type]').value,
    n: Math.max(1, Number(q('[data-n]').value) || 1),
    unit: q('[data-unit]').value,
    time: q('[data-time]').value || '08:00',
    days: [...root.querySelectorAll('[data-days] input:checked')].map(i => i.value),
  });

  let checkTimer;
  const syncSchedUi = () => {
    const type = q('[data-type]').value;
    q('[data-every]').hidden = type !== 'every';
    q('[data-days]').hidden = type !== 'weekly';
    q('[data-at]').hidden = type === 'every';
    const s = current();
    const hint = q('[data-sched-hint]');
    hint.className = 'hint';
    hint.replaceChildren(describe(s) + ' · ', el('code', {}, s));
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
      const r = await call('GET', '/check-schedule?s=' + enc(s)).catch(() => null);
      if (r && !r.ok) { hint.className = 'hint bad'; hint.textContent = r.error; }
    }, 250);
  };
  syncSchedUi();
  root.querySelectorAll('[data-type], [data-n], [data-unit], [data-time], [data-days] input')
    .forEach(i => i.addEventListener('input', () => { markDirty(); syncSchedUi(); }));
  root.querySelectorAll('[data-prompt], [data-enabled], [data-digest], [data-mcp] select')
    .forEach(i => i.addEventListener('input', markDirty));

  const syncName = () => {
    const slug = slugify(q('[data-name]').value);
    const hint = q('[data-name-hint]');
    hint.className = 'hint' + (slug ? '' : ' bad');
    if (!slug) hint.textContent = 'Ange ett namn.';
    else hint.replaceChildren('Sparas som ', el('code', {}, `tasks/${slug}.md`),
      !isNew && slug !== task.name ? '. Loggar och filer flyttas med.' : '');
    return slug;
  };
  syncName();
  q('[data-name]').addEventListener('input', () => { markDirty(); syncName(); });

  const save = async btn => {
    btn.disabled = true;
    const mcp = [...root.querySelectorAll('[data-mcp] select')].filter(s => s.value)
      .map(s => ({ name: s.dataset.mcpName, level: s.value }));
    // Ett befintligt jobb slås på och av i raden ovanför flikarna
    const enabled = isNew ? q('[data-enabled]').checked : (tasks.find(x => x.name === task.name) || task).enabled;
    const body = { name: syncName(), schedule: current(), enabled, digest: q('[data-digest]').checked, mcp, prompt: q('[data-prompt]').value };
    try {
      if (!body.name) throw new Error('Ange ett namn');
      if (isNew) await call('POST', '/tasks', body);
      else await call('PUT', '/tasks/' + enc(task.name), body);
      dirty = false;
      toast(isNew ? (body.enabled ? 'Jobbet skapat och schemalagt' : 'Jobbet skapat (avstängt)') : 'Sparat');
      await loadTasks();
      const target = taskHref(body.name, isNew ? 'results' : 'settings');
      if (location.hash !== target) location.hash = target;
      else render();
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  };

  if (isNew) {
    q('[data-save-new]').onclick = e => save(e.currentTarget);
    q('[data-name]').focus();
    return;
  }
  q('[data-save]').onclick = e => save(e.currentTarget);
  q('[data-undo]').onclick = () => { dirty = false; renderSettings(container, tasks.find(x => x.name === task.name) || task); };
  q('[data-delete]').onclick = async () => {
    if (!confirm(`Ta bort jobbet "${pretty(task.name)}"? Loggar och filer i work/${task.name} sparas.`)) return;
    try {
      await call('DELETE', '/tasks/' + enc(task.name));
      dirty = false;
      toast('Borttaget');
      await loadTasks();
      location.hash = '#/';
    } catch (err) { toast(err.message, true); }
  };
}

// ---------- profil ----------

// Samma text som profileText() i ui/lib.mjs
function profileText(p) {
  const lines = [];
  if (p.name) lines.push(`- Namn: ${p.name}`);
  if (p.emails.length) lines.push(`- E-post: ${p.emails.join(', ')}`);
  if (p.slack.id || p.slack.name) {
    const ws = p.slack.workspace ? ` i workspacen ${p.slack.workspace}` : '';
    const id = p.slack.id ? `, användar-ID ${p.slack.id} (omnämnanden ser ut som <@${p.slack.id}>)` : '';
    lines.push(`- Slack: ${p.slack.name || 'okänt namn'}${ws}${id}`);
  }
  if (p.github) lines.push(`- GitHub: ${p.github}`);
  if (p.timezone) lines.push(`- Tidszon: ${p.timezone}. Ange tider i den tidszonen.`);
  if (p.notes) lines.push(`- Övrigt: ${p.notes}`);
  if (!lines.length) return '(tom profil – inget läggs till)';
  return `Du arbetar åt den här personen. "Jag", "mig" och "min" i uppgiften syftar på hen:\n${lines.join('\n')}`;
}

async function renderProfile() {
  const main = document.getElementById('main');
  let data;
  try { data = await call('GET', '/profile'); } catch (e) { return toast(e.message, true); }
  if (route.view !== 'profile') return;
  const frag = document.getElementById('profile-tpl').content.cloneNode(true);
  main.replaceChildren(frag);
  const q = s => main.querySelector(s);
  const fields = [...main.querySelectorAll('[data-f]')];

  const fill = p => {
    for (const f of fields) {
      const [a, b] = f.dataset.f.split('.');
      const v = b ? p?.[a]?.[b] : p?.[a];
      f.value = Array.isArray(v) ? v.join('\n') : (v || '');
    }
  };
  const read = () => {
    const p = { slack: {} };
    for (const f of fields) {
      const [a, b] = f.dataset.f.split('.');
      const v = a === 'emails' ? f.value.split(/[\n,]/).map(x => x.trim()).filter(Boolean) : f.value.trim();
      if (b) p[a][b] = v; else p[a] = v;
    }
    return p;
  };
  const preview = () => { q('[data-preview]').textContent = profileText(read()); };

  fill(data.profile || data.detected || {});
  preview();
  fields.forEach(f => f.addEventListener('input', () => { dirty = true; preview(); }));
  const digest = data.profile?.digest || {};
  q('[data-digest-enabled]').checked = !!digest.enabled;
  q('[data-digest-time]').value = digest.time || '07:30';
  main.querySelectorAll('[data-digest-enabled], [data-digest-time]').forEach(i => i.addEventListener('input', () => { dirty = true; }));
  q('[data-digest-now]').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    try { await call('POST', '/digest'); toast('Morgonmejlet skickas om någon minut'); }
    catch (err) { toast(err.message, true); }
    btn.disabled = false;
  };

  const d = data.detected;
  q('[data-detect-hint]').textContent = d
    ? `Hittade: ${[d.name, d.github && 'GitHub', d.slack?.id && 'Slack', d.emails?.length && `${d.emails.length} e-post`].filter(Boolean).join(', ')}`
    : 'Inget hittat än (Macen måste vara online).';
  q('[data-detect]').disabled = !d;
  q('[data-detect]').onclick = () => {
    const cur = read();
    // Behåll det du själv skrivit i Övrigt och slå ihop e-postadresserna
    fill({ ...d, emails: [...new Set([...(cur.emails || []), ...(d.emails || [])])], notes: cur.notes || d.notes });
    dirty = true; preview();
  };

  q('[data-save]').onclick = async e => {
    const btn = e.currentTarget; btn.disabled = true;
    try {
      const p = { ...read(), digest: { enabled: q('[data-digest-enabled]').checked, time: q('[data-digest-time]').value } };
      await call('PUT', '/profile', p);
      dirty = false;
      firstName = (p.name || '').split(/\s+/)[0];
      toast('Profilen sparad');
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  };
}

// ---------- uppdatering ----------

// Ritar om det som kan ha ändrats, utan att röra formulär som redigeras
function refreshView() {
  if (route.view === 'overview') return renderOverview(true);
  if (route.view !== 'task') return;
  const t = tasks.find(x => x.name === route.name);
  if (!t) { if (!dirty) renderTask(); return; }
  renderTaskHead(t);
  renderTab(true);
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    await Promise.all([loadTasks(), loadStatus()]);
    if (route.view === 'overview') await loadPlan();
  } finally { refreshing = false; }
  refreshView();
}

async function start() {
  window.addEventListener('hashchange', onHashChange);
  window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
  route = parseRoute();
  currentHash = location.hash;
  call('GET', '/mcp').then(list => {
    mcpServers = list;
    if (!dirty && (route.view === 'new' || route.tab === 'settings')) render();
  }).catch(() => {});
  call('GET', '/profile').then(p => {
    firstName = (p.profile?.name || p.detected?.name || '').split(/\s+/)[0];
    if (route.view === 'overview') renderOverview(true);
  }).catch(() => {});
  await Promise.all([loadTasks(), loadStatus()]);
  render();
  setInterval(refresh, 4000);
}

// I molnläget startar cloud.js appen efter inloggning
if (window.CLOUD_MODE) window.startApp = start;
else start();
